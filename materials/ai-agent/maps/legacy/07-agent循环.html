<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, height=900">
<title>Agent 循环 · 上下文增长的引擎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1600px; height: 900px;
  background: #FFFDF7;
  font-family: 'Ma Shan Zheng', cursive;
  overflow: hidden; position: relative;
}
.canvas-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.content-layer { position: relative; width: 100%; height: 100%; z-index: 2; }
</style>
</head>
<body>
<canvas id="sketch-canvas" class="canvas-layer" width="1600" height="900"></canvas>
<div class="content-layer">
<svg viewBox="0 0 1600 900" width="1600" height="900" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;">

  <!-- 标题 -->
  <text x="70" y="86" font-family="Ma Shan Zheng" font-size="58" fill="#2C2C2C">循环是上下文增长的引擎</text>
  <text x="70" y="134" font-family="Ma Shan Zheng" font-size="30" fill="#2C2C2C" opacity="0.75">所以 L2 的问题（预算 / 压缩 / 污染）都在这里被放大</text>
  <text x="1160" y="82" font-family="Caveat" font-size="36" font-weight="700" fill="#E5A800">L2 → L3 · Loop</text>

  <!-- 左侧说明 -->
  <text x="70" y="208" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">为什么要多轮：动作结果只有做了才知道</text>
  <text x="70" y="242" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.8">下一步依赖上一步的观察</text>

  <!-- ============ 循环箭头（Rough.js 弧线画在 canvas 层，箭头在此） ============ -->
  <polygon points="504.6,480.8 496.9,462.2 514.9,463.4" fill="#2C2C2C"/>
  <polygon points="263.3,598.5 283.2,601.1 273.2,616.1" fill="#2C2C2C"/>
  <polygon points="282.0,330.7 269.7,346.7 261.9,330.5" fill="#2C2C2C"/>

  <!-- 循环中心文字 -->
  <text x="350" y="456" text-anchor="middle" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">每转一圈</text>
  <text x="350" y="494" text-anchor="middle" font-family="Ma Shan Zheng" font-size="30" fill="#E5A800">上下文变长</text>

  <!-- 三个节点 -->
  <g>
    <circle cx="350" cy="315" r="62" stroke="#2C2C2C" stroke-width="3" fill="#FFFDF7"/>
    <text x="350" y="316" text-anchor="middle" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">思考</text>
    <text x="350" y="346" text-anchor="middle" font-family="Caveat" font-size="22" font-weight="700" fill="#E5A800">think</text>
  </g>
  <g>
    <circle cx="484" cy="548" r="62" stroke="#2C2C2C" stroke-width="3" fill="#FFFDF7"/>
    <text x="484" y="549" text-anchor="middle" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">行动</text>
    <text x="484" y="579" text-anchor="middle" font-family="Caveat" font-size="22" font-weight="700" fill="#E5A800">act</text>
  </g>
  <g>
    <circle cx="216" cy="548" r="62" stroke="#2C2C2C" stroke-width="3" fill="#FFFDF7"/>
    <text x="216" y="549" text-anchor="middle" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">观察</text>
    <text x="216" y="579" text-anchor="middle" font-family="Caveat" font-size="22" font-weight="700" fill="#E5A800">observe</text>
  </g>

  <!-- 累积柱子 -->
  <g>
    <rect x="566" y="656" width="36" height="44" fill="#E5A800" stroke="#2C2C2C" stroke-width="2" opacity="0.85"/>
    <rect x="612" y="620" width="36" height="80" fill="#E5A800" stroke="#2C2C2C" stroke-width="2" opacity="0.85"/>
    <rect x="658" y="580" width="36" height="120" fill="#E5A800" stroke="#2C2C2C" stroke-width="2" opacity="0.85"/>
    <text x="700" y="736" text-anchor="end" font-family="Ma Shan Zheng" font-size="24" fill="#2C2C2C" opacity="0.8">上下文逐轮累积</text>
  </g>
  <text x="70" y="858" font-family="Ma Shan Zheng" font-size="25" fill="#2C2C2C">每一轮的新观察和工具返回原文，都累积进上下文</text>

  <!-- 竖分隔 -->
  <line x1="710" y1="180" x2="710" y2="800" stroke="#2C2C2C" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.45"/>

  <!-- ============ 右一：终止条件 ============ -->
  <g transform="translate(730, 195)">
    <rect x="0" y="0" width="810" height="185" rx="16" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <rect x="24" y="-20" width="200" height="42" rx="21" fill="#E5A800" opacity="0.9"/>
    <text x="124" y="10" text-anchor="middle" font-family="Ma Shan Zheng" font-size="28" fill="#2C2C2C">终止条件</text>
    <text x="26" y="80" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">目标达成判据 · 无进展检测 · 预算耗尽 · 交给人</text>
    <text x="26" y="122" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.8">无进展 = 同样的动作又重复了一遍</text>
    <text x="26" y="162" font-family="Ma Shan Zheng" font-size="24" fill="#CC4444">✗ 以为循环次数上限是唯一的终止手段</text>
  </g>

  <!-- ============ 右二：规划 ============ -->
  <g transform="translate(730, 400)">
    <rect x="0" y="0" width="810" height="180" rx="16" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <rect x="24" y="-20" width="150" height="42" rx="21" fill="#E5A800" opacity="0.9"/>
    <text x="99" y="10" text-anchor="middle" font-family="Ma Shan Zheng" font-size="28" fill="#2C2C2C">规划</text>
    <text x="26" y="76" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">先规划再执行 vs 边做边调整，各有代价</text>
    <text x="26" y="118" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.8">真正要设计的是：计划失效时怎么重规划</text>
    <text x="26" y="158" font-family="Ma Shan Zheng" font-size="24" fill="#CC4444">✗ 以为把计划写得足够细就能减少失败</text>
  </g>

  <!-- ============ 右三：子 agent ============ -->
  <g transform="translate(730, 608)">
    <rect x="0" y="0" width="810" height="176" rx="16" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <rect x="24" y="-20" width="330" height="42" rx="21" fill="#E5A800" opacity="0.9"/>
    <text x="189" y="10" text-anchor="middle" font-family="Ma Shan Zheng" font-size="28" fill="#2C2C2C">子 agent 与上下文隔离</text>
    <text x="26" y="72" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">收益：隔离污染、可并行</text>
    <text x="26" y="112" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.85">代价：交接处的信息损失、子 agent 无法追问</text>
    <text x="26" y="152" font-family="Ma Shan Zheng" font-size="24" fill="#CC4444">✗ 以为拆得越多越可靠</text>
  </g>

  <!-- ============ 底部一句 ============ -->
  <text x="730" y="856" font-family="Ma Shan Zheng" font-size="32" fill="#2C2C2C">拆分省下的是上下文，付出的是<tspan fill="#E5A800">交接</tspan>。</text>

  <!-- 读书的女孩 -->
  <g transform="translate(1420, 792) scale(0.74)">
    <ellipse cx="60" cy="112" rx="56" ry="13" fill="#2C2C2C" opacity="0.32"/>
    <ellipse cx="60" cy="34" rx="34" ry="37" stroke="#2C2C2C" stroke-width="3.2" fill="#FFFDF7"/>
    <path d="M26 24 C30 -10, 90 -10, 94 26 C86 8, 70 2, 60 12 C48 2, 32 8, 26 24 Z" fill="#E5A800" stroke="#2C2C2C" stroke-width="2.6" opacity="0.75"/>
    <circle cx="49" cy="38" r="3.4" fill="#2C2C2C"/>
    <circle cx="71" cy="38" r="3.4" fill="#2C2C2C"/>
    <path d="M52 50 C57 56, 63 56, 68 50" stroke="#2C2C2C" stroke-width="2.4" fill="none"/>
    <path d="M60 71 L60 98 M60 78 L28 92 M60 78 L92 92" stroke="#2C2C2C" stroke-width="3.2" fill="none"/>
    <path d="M18 90 L60 82 L102 90 L60 100 Z" fill="#FFFDF7" stroke="#2C2C2C" stroke-width="2.6"/>
    <path d="M60 82 L60 100" stroke="#2C2C2C" stroke-width="2"/>
  </g>

  <!-- 装饰小方块 -->
  <rect x="1100" y="120" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(18, 1100, 120)"/>
  <rect x="1470" y="140" width="10" height="10" fill="#E5A800" transform="rotate(-12, 1470, 140)"/>
  <rect x="1560" y="460" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(24, 1560, 460)"/>
  <rect x="42" y="330" width="10" height="10" fill="#E5A800" transform="rotate(28, 42, 330)"/>
  <rect x="46" y="640" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(-18, 46, 640)"/>
  <rect x="640" y="256" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(-20, 640, 256)"/>
  <rect x="36" y="748" width="9" height="9" fill="#E5A800" transform="rotate(14, 36, 748)"/>
  <rect x="1330" y="866" width="11" height="11" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(20, 1330, 866)"/>

</svg>
</div>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const rc = rough.canvas(document.getElementById('sketch-canvas'));

  // 标题下的手绘强调
  rc.path('M70 150 C240 176, 560 176, 780 152', { stroke: '#E5A800', strokeWidth: 3, roughness: 1.9, fill: 'none' });
  rc.circle(1130, 68, 9, { fill: '#2C2C2C', fillStyle: 'solid', stroke: 'none', roughness: 0.5 });

  // 循环弧线（思考 → 行动 → 观察 → 思考）
  const arcOpt = { stroke: '#2C2C2C', strokeWidth: 3, roughness: 1.6, fill: 'none' };
  rc.path('M417.9 330.7 A155 155 0 0 1 504.6 480.8', arcOpt);
  rc.path('M436.7 598.5 A155 155 0 0 1 263.3 598.5', arcOpt);
  rc.path('M195.4 480.8 A155 155 0 0 1 282.0 330.7', arcOpt);

  // 柱子上升趋势的手绘弧
  rc.path('M572 640 C610 596, 646 566, 690 556', { stroke: '#E5A800', strokeWidth: 2.4, roughness: 1.8, fill: 'none' });

  // 底部分隔线
  rc.line(730, 818, 1300, 818, { stroke: '#2C2C2C', strokeWidth: 1.5, roughness: 1.6 });
  rc.line(70, 822, 620, 822, { stroke: '#2C2C2C', strokeWidth: 1.5, roughness: 1.6 });
  rc.circle(1572, 240, 8, { fill: '#E5A800', fillStyle: 'solid', stroke: 'none', roughness: 0.5 });
});
</script>
</body>
</html>
