<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, height=900">
<title>工具调用 · 参数是生成出来的</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1600px; height: 900px;
  background: #FFFDF7;
  font-family: 'Ma Shan Zheng', cursive;
  overflow: hidden; position: relative;
}
.canvas-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.content-layer { position: relative; width: 100%; height: 100%; z-index: 2; }
</style>
</head>
<body>
<canvas id="sketch-canvas" class="canvas-layer" width="1600" height="900"></canvas>
<div class="content-layer">
<svg viewBox="0 0 1600 900" width="1600" height="900" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;">

  <!-- 标题 -->
  <text x="70" y="86" font-family="Ma Shan Zheng" font-size="58" fill="#2C2C2C">参数是生成出来的，所以它会编</text>
  <text x="70" y="134" font-family="Ma Shan Zheng" font-size="30" fill="#2C2C2C" opacity="0.75">工具调用 — 校验必须在工具侧，不能指望 prompt</text>
  <text x="1150" y="82" font-family="Caveat" font-size="36" font-weight="700" fill="#E5A800">L2 · Tool Use</text>

  <!-- 误解靶子 -->
  <text x="880" y="132" font-family="Ma Shan Zheng" font-size="25" fill="#CC4444">✗ 以为工具选择是框架做的规则匹配</text>

  <!-- ============ 流程行 ============ -->
  <!-- 1 模型 -->
  <g transform="translate(80, 186)">
    <rect x="0" y="0" width="250" height="104" rx="14" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <text x="125" y="46" text-anchor="middle" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">模型</text>
    <text x="125" y="82" text-anchor="middle" font-family="Ma Shan Zheng" font-size="23" fill="#2C2C2C" opacity="0.75">上下文里带着工具定义</text>
  </g>
  <path d="M344 238 L390 238" stroke="#2C2C2C" stroke-width="2.5"/>
  <polygon points="406,238 386,229 386,247" fill="#2C2C2C"/>

  <!-- 2 生成（3D块 · 重点） -->
  <g transform="translate(420, 186)">
    <path d="M0 24 L300 24 L300 104 L0 104 Z" fill="#E5A800" stroke="#2C2C2C" stroke-width="2.5" opacity="0.85"/>
    <path d="M0 24 L22 2 L322 2 L300 24 Z" fill="#F0C030" stroke="#2C2C2C" stroke-width="2" opacity="0.85"/>
    <path d="M300 24 L322 2 L322 82 L300 104 Z" fill="#C89800" stroke="#2C2C2C" stroke-width="2" opacity="0.85"/>
    <text x="22" y="62" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">生成一段结构化文本</text>
    <text x="20" y="93" font-family="Ma Shan Zheng" font-size="23" fill="#2C2C2C">工具名和参数都是生成的</text>
  </g>
  <path d="M756 238 L802 238" stroke="#2C2C2C" stroke-width="2.5"/>
  <polygon points="818,238 798,229 798,247" fill="#2C2C2C"/>

  <!-- 3 校验闸门 -->
  <g transform="translate(846, 186)">
    <rect x="0" y="0" width="300" height="104" rx="14" stroke="#CC4444" stroke-width="3" fill="#FFFDF7"/>
    <text x="150" y="46" text-anchor="middle" font-family="Ma Shan Zheng" font-size="32" fill="#2C2C2C">工具侧校验闸门</text>
    <text x="150" y="82" text-anchor="middle" font-family="Ma Shan Zheng" font-size="23" fill="#CC4444">一段代码，不是 prompt</text>
  </g>
  <path d="M1160 238 L1206 238" stroke="#2C2C2C" stroke-width="2.5"/>
  <polygon points="1222,238 1202,229 1202,247" fill="#2C2C2C"/>

  <!-- 4 执行 -->
  <g transform="translate(1250, 186)">
    <rect x="0" y="0" width="150" height="104" rx="14" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <text x="75" y="46" text-anchor="middle" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">执行</text>
    <text x="75" y="82" text-anchor="middle" font-family="Caveat" font-size="26" font-weight="700" fill="#E5A800" opacity="0.9">run</text>
  </g>

  <!-- 流程注脚 -->
  <text x="82" y="322" font-family="Ma Shan Zheng" font-size="25" fill="#2C2C2C" opacity="0.78">工具定义随每一轮请求进上下文 = 固定开销</text>

  <!-- ============ 红色警示块 ============ -->
  <rect x="70" y="348" width="1470" height="152" rx="16" stroke="#CC4444" stroke-width="3" fill="#CC4444" fill-opacity="0.05"/>
  <g transform="translate(102, 328)">
    <rect x="0" y="0" width="230" height="44" rx="22" fill="#CC4444" opacity="0.9"/>
    <text x="115" y="32" text-anchor="middle" font-family="Ma Shan Zheng" font-size="28" fill="#FFFDF7">已经踩过的坑</text>
  </g>
  <text x="104" y="424" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">prompt 是喂给生成过程的输入</text>
  <text x="104" y="464" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">不是卡在「生成」和「执行」之间的检查点</text>
  <line x1="800" y1="392" x2="800" y2="480" stroke="#CC4444" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.5"/>
  <text x="832" y="424" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">黑名单永远枚举不完，白名单是有限集</text>
  <text x="832" y="464" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">resolve() 先展平 .. 与软链接，再判白名单</text>

  <!-- ============ 三块 ============ -->
  <!-- 工具设计 -->
  <g transform="translate(70, 532)">
    <rect x="0" y="0" width="450" height="248" rx="16" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <rect x="24" y="-20" width="200" height="42" rx="21" fill="#E5A800" opacity="0.9"/>
    <text x="124" y="10" text-anchor="middle" font-family="Ma Shan Zheng" font-size="28" fill="#2C2C2C">工具设计</text>
    <text x="26" y="76" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">粒度怎么定</text>
    <text x="26" y="118" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">命名和描述影响选择准确率</text>
    <text x="26" y="160" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">相似工具会互相干扰</text>
    <text x="26" y="202" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.85">返回体积就是上下文预算</text>
    <text x="26" y="234" font-family="Ma Shan Zheng" font-size="24" fill="#CC4444">✗ 不是越多越强</text>
  </g>

  <!-- 失败处理 -->
  <g transform="translate(580, 532)">
    <rect x="0" y="0" width="450" height="248" rx="16" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <rect x="24" y="-20" width="200" height="42" rx="21" fill="#E5A800" opacity="0.9"/>
    <text x="124" y="10" text-anchor="middle" font-family="Ma Shan Zheng" font-size="28" fill="#2C2C2C">失败处理</text>
    <text x="26" y="76" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">先分可重试 / 不可重试</text>
    <text x="26" y="118" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">再谈退避</text>
    <text x="26" y="160" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">错误信息要能让模型自我纠正</text>
    <text x="26" y="202" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.85">而不是把栈原样丢回去</text>
  </g>

  <!-- 副作用与幂等 -->
  <g transform="translate(1090, 532)">
    <rect x="0" y="0" width="450" height="248" rx="16" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <rect x="24" y="-20" width="250" height="42" rx="21" fill="#E5A800" opacity="0.9"/>
    <text x="149" y="10" text-anchor="middle" font-family="Ma Shan Zheng" font-size="28" fill="#2C2C2C">副作用与幂等</text>
    <text x="26" y="76" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">超时 ≠ 没执行</text>
    <text x="26" y="118" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">状态是未知，不是失败</text>
    <text x="26" y="160" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C">不可重试的工具要标出来</text>
    <text x="26" y="202" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.85">重放前先想清楚破坏半径</text>
  </g>

  <!-- ============ 底部一句 ============ -->
  <text x="70" y="852" font-family="Ma Shan Zheng" font-size="32" fill="#2C2C2C">「顺利执行」不是目标，是反目标 —— 对不可逆动作，<tspan fill="#E5A800">报错是好事</tspan>。</text>

  <!-- 读书的女孩 -->
  <g transform="translate(1418, 42) scale(0.82)">
    <ellipse cx="60" cy="112" rx="56" ry="13" fill="#2C2C2C" opacity="0.32"/>
    <ellipse cx="60" cy="34" rx="34" ry="37" stroke="#2C2C2C" stroke-width="3.2" fill="#FFFDF7"/>
    <path d="M26 24 C30 -10, 90 -10, 94 26 C86 8, 70 2, 60 12 C48 2, 32 8, 26 24 Z" fill="#E5A800" stroke="#2C2C2C" stroke-width="2.6" opacity="0.75"/>
    <circle cx="49" cy="38" r="3.4" fill="#2C2C2C"/>
    <circle cx="71" cy="38" r="3.4" fill="#2C2C2C"/>
    <path d="M52 50 C57 56, 63 56, 68 50" stroke="#2C2C2C" stroke-width="2.4" fill="none"/>
    <path d="M60 71 L60 98 M60 78 L28 92 M60 78 L92 92" stroke="#2C2C2C" stroke-width="3.2" fill="none"/>
    <path d="M18 90 L60 82 L102 90 L60 100 Z" fill="#FFFDF7" stroke="#2C2C2C" stroke-width="2.6"/>
    <path d="M60 82 L60 100" stroke="#2C2C2C" stroke-width="2"/>
  </g>

  <!-- 装饰小方块 -->
  <rect x="856" y="164" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(18, 856, 164)"/>
  <rect x="1420" y="164" width="10" height="10" fill="#E5A800" transform="rotate(-12, 1420, 164)"/>
  <rect x="1552" y="410" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(24, 1552, 410)"/>
  <rect x="40" y="524" width="10" height="10" fill="#E5A800" transform="rotate(28, 40, 524)"/>
  <rect x="1200" y="828" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(-18, 1200, 828)"/>
  <rect x="1300" y="866" width="9" height="9" fill="#E5A800" transform="rotate(14, 1300, 866)"/>
  <rect x="1470" y="820" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(22, 1470, 820)"/>
  <rect x="46" y="200" width="9" height="9" fill="#E5A800" transform="rotate(-20, 46, 200)"/>

</svg>
</div>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const rc = rough.canvas(document.getElementById('sketch-canvas'));
  rc.path('M70 150 C260 176, 560 176, 790 152', { stroke: '#E5A800', strokeWidth: 3, roughness: 1.9, fill: 'none' });
  rc.circle(866, 66, 9, { fill: '#2C2C2C', fillStyle: 'solid', stroke: 'none', roughness: 0.5 });
  rc.line(70, 810, 1000, 810, { stroke: '#2C2C2C', strokeWidth: 1.5, roughness: 1.6 });
  rc.path('M1290 800 C1340 776, 1390 784, 1414 812', { stroke: '#E5A800', strokeWidth: 2.4, roughness: 1.8, fill: 'none' });
  rc.circle(1568, 240, 8, { fill: '#E5A800', fillStyle: 'solid', stroke: 'none', roughness: 0.5 });
});
</script>
</body>
</html>
