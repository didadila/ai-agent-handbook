<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, height=900">
<title>AI Agent 知识地图 · 评测集五要素</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1600px; height: 900px;
  background: #FFFDF7;
  font-family: 'Ma Shan Zheng', cursive;
  overflow: hidden; position: relative;
}
.canvas-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.content-layer { position: relative; width: 100%; height: 100%; z-index: 2; }
</style>
</head>
<body>
<canvas id="sketch-canvas" class="canvas-layer" width="1600" height="900"></canvas>
<div class="content-layer">
<svg viewBox="0 0 1600 900" width="1600" height="900" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;">

  <!-- 标题 -->
  <text x="70" y="88" font-family="Ma Shan Zheng" font-size="62" fill="#2C2C2C">评测集五要素</text>
  <text x="70" y="136" font-family="Ma Shan Zheng" font-size="32" fill="#2C2C2C" opacity="0.75">单次运行没有结论</text>
  <text x="478" y="82" font-family="Caveat" font-size="40" font-weight="700" fill="#E5A800">Evaluation · L3</text>

  <!-- 五个编号步骤（阶梯式） -->
  <g>
    <!-- 1 -->
    <circle cx="92" cy="208" r="22" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <text x="92" y="219" text-anchor="middle" font-family="Caveat" font-size="30" font-weight="700" fill="#2C2C2C">1</text>
    <text x="128" y="220" font-family="Ma Shan Zheng" font-size="33" fill="#2C2C2C">固定输入集</text>
    <text x="128" y="256" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.82">含边界 case + 历史翻车 case</text>
    <path d="M92 230 L118 296" stroke="#E5A800" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- 2 -->
    <circle cx="118" cy="318" r="22" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <text x="118" y="329" text-anchor="middle" font-family="Caveat" font-size="30" font-weight="700" fill="#2C2C2C">2</text>
    <text x="154" y="330" font-family="Ma Shan Zheng" font-size="33" fill="#2C2C2C">可判定的判据</text>
    <text x="154" y="366" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.82">程序能判的就让程序判</text>
    <path d="M118 340 L144 406" stroke="#E5A800" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- 3 -->
    <circle cx="144" cy="428" r="22" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <text x="144" y="439" text-anchor="middle" font-family="Caveat" font-size="30" font-weight="700" fill="#2C2C2C">3</text>
    <text x="180" y="440" font-family="Ma Shan Zheng" font-size="33" fill="#2C2C2C">每个 case 跑 3-5 次</text>
    <text x="180" y="476" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.82">看通过率，不看单次成败</text>
    <path d="M144 450 L170 516" stroke="#E5A800" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- 4 -->
    <circle cx="170" cy="538" r="22" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <text x="170" y="549" text-anchor="middle" font-family="Caveat" font-size="30" font-weight="700" fill="#2C2C2C">4</text>
    <text x="206" y="550" font-family="Ma Shan Zheng" font-size="33" fill="#2C2C2C">对比基线</text>
    <text x="206" y="586" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.82">18/20 → 19/20 在噪声内，不算改进</text>
    <path d="M170 560 L196 626" stroke="#E5A800" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- 5 -->
    <circle cx="196" cy="648" r="22" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <text x="196" y="659" text-anchor="middle" font-family="Caveat" font-size="30" font-weight="700" fill="#2C2C2C">5</text>
    <text x="232" y="660" font-family="Ma Shan Zheng" font-size="33" fill="#2C2C2C">看回归，不看总分</text>
    <text x="232" y="696" font-family="Ma Shan Zheng" font-size="26" fill="#2C2C2C" opacity="0.82">修好 3 个弄坏 3 个，比不改更糟</text>
    <text x="232" y="730" font-family="Ma Shan Zheng" font-size="24" fill="#2C2C2C" opacity="0.68">坏掉的那 3 个，你没盯着</text>
  </g>

  <!-- 清单图标 -->
  <g transform="translate(1352, 40)">
    <rect x="8" y="18" width="118" height="140" rx="10" stroke="#2C2C2C" stroke-width="2.8" fill="#FFFDF7"/>
    <rect x="44" y="4" width="46" height="26" rx="8" stroke="#2C2C2C" stroke-width="2.5" fill="#E5A800" opacity="0.85"/>
    <path d="M26 60 L34 70 L50 48" stroke="#E5A800" stroke-width="3.4" fill="none"/>
    <line x1="60" y1="60" x2="110" y2="60" stroke="#2C2C2C" stroke-width="2"/>
    <path d="M26 100 L34 110 L50 88" stroke="#E5A800" stroke-width="3.4" fill="none"/>
    <line x1="60" y1="100" x2="110" y2="100" stroke="#2C2C2C" stroke-width="2"/>
    <path d="M26 132 L44 148 M44 132 L26 148" stroke="#CC4444" stroke-width="3.2"/>
    <line x1="60" y1="140" x2="110" y2="140" stroke="#2C2C2C" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- 分隔线 -->
  <line x1="862" y1="182" x2="862" y2="790" stroke="#2C2C2C" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.5"/>

  <!-- 常见误解 -->
  <g transform="translate(890, 190)">
    <rect x="0" y="0" width="216" height="52" rx="26" fill="#E5A800" opacity="0.85"/>
    <text x="108" y="37" text-anchor="middle" font-family="Ma Shan Zheng" font-size="31" fill="#2C2C2C">常见误解</text>
  </g>

  <g>
    <path d="M892 272 L910 290 M910 272 L892 290" stroke="#CC4444" stroke-width="3.2"/>
    <text x="926" y="292" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">跑几个 case 看输出好不好就算过了</text>

    <path d="M892 332 L910 350 M910 332 L892 350" stroke="#CC4444" stroke-width="3.2"/>
    <text x="926" y="352" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">用单次成败判断是改进还是退步</text>

    <path d="M892 392 L910 410 M910 392 L892 410" stroke="#CC4444" stroke-width="3.2"/>
    <text x="926" y="412" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">断言越多越严格？</text>
    <text x="926" y="446" font-family="Ma Shan Zheng" font-size="25" fill="#2C2C2C" opacity="0.8">「有没有改动都通过」的断言等于没测</text>

    <path d="M892 486 L910 504 M910 486 L892 504" stroke="#CC4444" stroke-width="3.2"/>
    <text x="926" y="506" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">换个更强的模型做裁判就客观？</text>
    <text x="926" y="540" font-family="Ma Shan Zheng" font-size="25" fill="#2C2C2C" opacity="0.8">裁判有位置偏好和长度偏好，要校准</text>
  </g>

  <!-- 仍有缺口 -->
  <g transform="translate(890, 590)">
    <rect x="0" y="0" width="650" height="176" rx="16" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <rect x="26" y="22" width="160" height="46" rx="23" fill="#E5A800" opacity="0.85"/>
    <text x="106" y="54" text-anchor="middle" font-family="Ma Shan Zheng" font-size="28" fill="#2C2C2C">仍有缺口</text>
    <text x="26" y="112" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C">输入集容易缩成单个 case</text>
    <text x="26" y="150" font-family="Ma Shan Zheng" font-size="24" fill="#2C2C2C" opacity="0.85">「删掉临时文件」通过，不等于「清理一下」也通过</text>
  </g>

  <!-- 装饰小方块 -->
  <rect x="820" y="128" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(18, 820, 128)"/>
  <rect x="1290" y="196" width="10" height="10" fill="#E5A800" transform="rotate(-12, 1290, 196)"/>
  <rect x="700" y="238" width="9" height="9" fill="#E5A800" transform="rotate(28, 700, 238)"/>
  <rect x="742" y="392" width="13" height="13" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(-16, 742, 392)"/>
  <rect x="716" y="600" width="11" height="11" fill="#E5A800" transform="rotate(14, 716, 600)"/>
  <rect x="1556" y="330" width="10" height="10" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(22, 1556, 330)"/>
  <rect x="404" y="836" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(20, 404, 836)"/>
  <rect x="640" y="812" width="9" height="9" fill="#E5A800" transform="rotate(-20, 640, 812)"/>
  <rect x="1000" y="836" width="11" height="11" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(10, 1000, 836)"/>

</svg>
</div>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const rc = rough.canvas(document.getElementById('sketch-canvas'));
  rc.path('M70 152 C170 174, 300 174, 400 152', { stroke: '#E5A800', strokeWidth: 3, roughness: 1.9, fill: 'none' });
  rc.circle(452, 106, 9, { fill: '#2C2C2C', fillStyle: 'solid', stroke: 'none', roughness: 0.5 });
  rc.circle(1330, 250, 8, { fill: '#E5A800', fillStyle: 'solid', stroke: 'none', roughness: 0.5 });
  rc.line(160, 786, 700, 786, { stroke: '#2C2C2C', strokeWidth: 1.5, roughness: 1.6 });
  rc.path('M240 806 C330 828, 470 828, 560 808', { stroke: '#E5A800', strokeWidth: 2.2, roughness: 1.8, fill: 'none' });
  rc.path('M1320 130 C1352 108, 1372 104, 1392 112', { stroke: '#E5A800', strokeWidth: 2.4, roughness: 1.8, fill: 'none' });
});
</script>
</body>
</html>
