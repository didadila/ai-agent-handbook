<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, height=900">
<title>模型的四条硬边界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1600px; height: 900px;
  background: #FFFDF7;
  font-family: 'Ma Shan Zheng', cursive;
  overflow: hidden; position: relative;
}
.canvas-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.content-layer { position: relative; width: 100%; height: 100%; z-index: 2; }
</style>
</head>
<body>
<canvas id="sketch-canvas" class="canvas-layer" width="1600" height="900"></canvas>
<div class="content-layer">
<svg viewBox="0 0 1600 900" width="1600" height="900" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;">

  <!-- 标题 -->
  <text x="70" y="88" font-family="Ma Shan Zheng" font-size="60" fill="#2C2C2C">模型的四条硬边界</text>
  <text x="70" y="138" font-family="Ma Shan Zheng" font-size="30" fill="#2C2C2C" opacity="0.75">L1 — 所有上层机制的前提</text>
  <text x="1310" y="90" font-family="Caveat" font-size="42" font-weight="700" fill="#E5A800">4 hard limits</text>

  <!-- 象限分隔虚线 -->
  <line x1="632" y1="196" x2="632" y2="690" stroke="#2C2C2C" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.42"/>
  <line x1="968" y1="196" x2="968" y2="690" stroke="#2C2C2C" stroke-width="1.5" stroke-dasharray="7 6" opacity="0.42"/>

  <!-- 中心机器人 -->
  <g transform="translate(690, 278)">
    <ellipse cx="105" cy="366" rx="88" ry="16" fill="#2C2C2C" opacity="0.3"/>
    <!-- 天线 -->
    <line x1="105" y1="42" x2="105" y2="12" stroke="#2C2C2C" stroke-width="3"/>
    <circle cx="105" cy="8" r="9" fill="#E5A800" stroke="#2C2C2C" stroke-width="2.5"/>
    <!-- 头 -->
    <rect x="0" y="42" width="210" height="152" rx="30" stroke="#2C2C2C" stroke-width="3.5" fill="#FFFDF7"/>
    <!-- 透明大脑 -->
    <path d="M40 92 C40 62, 170 62, 170 92 C170 114, 40 114, 40 92 Z" fill="#E5A800" stroke="#2C2C2C" stroke-width="2" opacity="0.55"/>
    <path d="M62 88 C78 76, 92 100, 108 86 C124 74, 138 98, 152 88" stroke="#2C2C2C" stroke-width="2" fill="none" opacity="0.75"/>
    <!-- 眼与嘴 -->
    <circle cx="72" cy="146" r="9" fill="#2C2C2C"/>
    <circle cx="138" cy="146" r="9" fill="#2C2C2C"/>
    <path d="M80 172 C95 182, 115 182, 130 172" stroke="#2C2C2C" stroke-width="2.6" fill="none"/>
    <!-- 颈 -->
    <line x1="105" y1="194" x2="105" y2="216" stroke="#2C2C2C" stroke-width="3"/>
    <!-- 身体 -->
    <rect x="26" y="216" width="158" height="128" rx="14" stroke="#2C2C2C" stroke-width="3.5" fill="#FFFDF7"/>
    <text x="105" y="292" text-anchor="middle" font-family="Caveat" font-size="40" font-weight="700" fill="#2C2C2C" opacity="0.8">LLM</text>
    <!-- 手臂 -->
    <path d="M26 246 L-8 276" stroke="#2C2C2C" stroke-width="3.2"/>
    <path d="M184 246 L218 276" stroke="#2C2C2C" stroke-width="3.2"/>
    <!-- 腿 -->
    <path d="M66 344 L60 366 M144 344 L150 366" stroke="#2C2C2C" stroke-width="3.2"/>
  </g>

  <!-- ① 逐 token 生成 -->
  <g transform="translate(70, 212)">
    <circle cx="17" cy="-11" r="17" fill="#E5A800" opacity="0.85"/>
    <text x="17" y="-1" text-anchor="middle" font-family="Caveat" font-size="26" font-weight="700" fill="#2C2C2C">1</text>
    <text x="48" y="0" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">逐 token 生成</text>
    <text x="0" y="46" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">输出是一个个采样出来的</text>
    <text x="0" y="84" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">temperature / top-p 改的是采样分布</text>
    <text x="0" y="122" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">同一输入两次不同是机制，不是 bug</text>
    <text x="0" y="164" font-family="Ma Shan Zheng" font-size="26" fill="#CC4444">✗ 以为它「想好了再答」、能自我修正</text>
  </g>

  <!-- ② 上下文窗口 -->
  <g transform="translate(70, 478)">
    <circle cx="17" cy="-11" r="17" fill="#E5A800" opacity="0.85"/>
    <text x="17" y="-1" text-anchor="middle" font-family="Caveat" font-size="26" font-weight="700" fill="#2C2C2C">2</text>
    <text x="48" y="0" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">上下文窗口</text>
    <text x="0" y="46" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">有限窗口 + token 化</text>
    <text x="0" y="84" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">长上下文里中段信息容易被忽略</text>
    <text x="0" y="120" font-family="Caveat" font-size="30" font-weight="700" fill="#E5A800">lost in the middle</text>
    <text x="0" y="164" font-family="Ma Shan Zheng" font-size="26" fill="#CC4444">✗ 以为没超窗口，塞多少都等效</text>
  </g>

  <!-- ③ 幻觉 -->
  <g transform="translate(1000, 212)">
    <circle cx="17" cy="-11" r="17" fill="#E5A800" opacity="0.85"/>
    <text x="17" y="-1" text-anchor="middle" font-family="Caveat" font-size="26" font-weight="700" fill="#2C2C2C">3</text>
    <text x="48" y="0" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">幻觉</text>
    <text x="0" y="46" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">生成机制的固有结果，不是 bug</text>
    <text x="0" y="84" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">检索只能缓解，不能消除</text>
    <text x="0" y="126" font-family="Ma Shan Zheng" font-size="26" fill="#CC4444">✗ 以为训练数据不够，提示词能禁止</text>
  </g>

  <!-- ④ 无状态 -->
  <g transform="translate(1000, 478)">
    <circle cx="17" cy="-11" r="17" fill="#E5A800" opacity="0.85"/>
    <text x="17" y="-1" text-anchor="middle" font-family="Caveat" font-size="26" font-weight="700" fill="#2C2C2C">4</text>
    <text x="48" y="0" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">无状态</text>
    <text x="0" y="46" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">每次调用都不记得上一次</text>
    <text x="0" y="84" font-family="Ma Shan Zheng" font-size="27" fill="#2C2C2C" opacity="0.85">「记忆」是外部把上下文重新拼给它</text>
    <text x="0" y="126" font-family="Ma Shan Zheng" font-size="26" fill="#CC4444">✗ 以为模型自己在维护会话状态</text>
  </g>

  <!-- 底部结论 -->
  <g transform="translate(560, 748)">
    <rect x="0" y="0" width="480" height="80" rx="18" stroke="#2C2C2C" stroke-width="2.5" fill="#FFFDF7"/>
    <text x="240" y="53" text-anchor="middle" font-family="Ma Shan Zheng" font-size="34" fill="#2C2C2C">先接受这四条，再谈<tspan fill="#E5A800">上层</tspan></text>
  </g>

  <!-- 读书的女孩 -->
  <g transform="translate(150, 706)">
    <ellipse cx="60" cy="112" rx="56" ry="13" fill="#2C2C2C" opacity="0.32"/>
    <ellipse cx="60" cy="34" rx="34" ry="37" stroke="#2C2C2C" stroke-width="3.2" fill="#FFFDF7"/>
    <path d="M26 24 C30 -10, 90 -10, 94 26 C86 8, 70 2, 60 12 C48 2, 32 8, 26 24 Z" fill="#E5A800" stroke="#2C2C2C" stroke-width="2.6" opacity="0.75"/>
    <circle cx="49" cy="38" r="3.4" fill="#2C2C2C"/>
    <circle cx="71" cy="38" r="3.4" fill="#2C2C2C"/>
    <path d="M52 50 C57 56, 63 56, 68 50" stroke="#2C2C2C" stroke-width="2.4" fill="none"/>
    <path d="M60 71 L60 98 M60 78 L28 92 M60 78 L92 92" stroke="#2C2C2C" stroke-width="3.2" fill="none"/>
    <path d="M18 90 L60 82 L102 90 L60 100 Z" fill="#FFFDF7" stroke="#2C2C2C" stroke-width="2.6"/>
    <path d="M60 82 L60 100" stroke="#2C2C2C" stroke-width="2"/>
  </g>

  <!-- 装饰小方块 -->
  <rect x="820" y="150" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(18, 820, 150)"/>
  <rect x="1250" y="160" width="10" height="10" fill="#E5A800" transform="rotate(-14, 1250, 160)"/>
  <rect x="1548" y="420" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(24, 1548, 420)"/>
  <rect x="700" y="200" width="9" height="9" fill="#E5A800" transform="rotate(28, 700, 200)"/>
  <rect x="700" y="700" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(-16, 700, 700)"/>
  <rect x="1120" y="700" width="11" height="11" fill="#E5A800" transform="rotate(14, 1120, 700)"/>
  <rect x="380" y="852" width="12" height="12" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(22, 380, 852)"/>
  <rect x="1280" y="800" width="9" height="9" fill="#E5A800" transform="rotate(-20, 1280, 800)"/>
  <rect x="1460" y="796" width="11" height="11" stroke="#E5A800" stroke-width="2" fill="none" transform="rotate(12, 1460, 796)"/>

</svg>
</div>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.min.js"></script>
<script>
document.fonts.ready.then(() => {
  const rc = rough.canvas(document.getElementById('sketch-canvas'));
  rc.path('M70 152 C210 178, 420 178, 560 154', { stroke: '#E5A800', strokeWidth: 3, roughness: 1.9, fill: 'none' });
  rc.circle(1560, 128, 9, { fill: '#2C2C2C', fillStyle: 'solid', stroke: 'none', roughness: 0.5 });
  rc.circle(620, 758, 8, { fill: '#E5A800', fillStyle: 'solid', stroke: 'none', roughness: 0.5 });
  rc.path('M300 786 C360 764, 440 768, 500 790', { stroke: '#E5A800', strokeWidth: 2.4, roughness: 1.8, fill: 'none' });
  rc.line(1000, 680, 1520, 680, { stroke: '#2C2C2C', strokeWidth: 1.5, roughness: 1.6 });
  rc.line(70, 680, 590, 680, { stroke: '#2C2C2C', strokeWidth: 1.5, roughness: 1.6 });
});
</script>
</body>
</html>
